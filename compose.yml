# Host=db: containers reach each other by service name; localhost would be the container itself.
x-db-connection: &db-connection "Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};GSS Encryption Mode=Disable"

services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    shm_size: 128mb

  # Applies migrations and seed data, then exits. The API waits for it to succeed.
  migrate:
    build:
      context: .
      target: migrator
    command: ["--connection", *db-connection]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    container_name: senabayu_api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: *db-connection
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data: